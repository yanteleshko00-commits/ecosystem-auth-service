services:
  - type: web
    name: ecosystem-auth-service
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ecosystem-auth-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: TOKEN_PEPPER
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OAUTH_CLIENTS_JSON
        value: "[]"
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: PORT
        value: "10000"

databases:
  - name: ecosystem-auth-db
    plan: free
    databaseName: ecosystem_auth
    user: ecosystem_auth_user
