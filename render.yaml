services:
  - type: web
    name: ecosystem-auth-service
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ecosystem-auth-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: TOKEN_PEPPER
        generateValue: true
      - key: UNISENDER_API_KEY
        sync: false
      - key: UNISENDER_API_URL
        value: https://go2.unisender.ru/ru/transactional/api/v1/email/send.json
      - key: UNISENDER_FROM_EMAIL
        sync: false
      - key: UNISENDER_FROM_NAME
        value: NEXORA ID
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: OAUTH_CLIENTS_JSON
        sync: false
      - key: PROJECTS_OAUTH_CLIENT_SECRET
        sync: false
      - key: PROJECTS_SERVICE_API_KEY
        sync: false
      - key: PROJECTS_REDIRECT_URI
        value: https://vse-proekty-ian-1.onrender.com/auth/callback
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: PORT
        value: "10000"

databases:
  - name: ecosystem-auth-db
    plan: free
    databaseName: ecosystem_auth
    user: ecosystem_auth_user
