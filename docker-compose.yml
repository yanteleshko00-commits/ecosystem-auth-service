services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecosystem
      POSTGRES_PASSWORD: change_this_password
      POSTGRES_DB: ecosystem_auth
    volumes:
      - auth_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosystem -d ecosystem_auth"]
      interval: 5s
      timeout: 3s
      retries: 20
  auth:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ecosystem:change_this_password@db:5432/ecosystem_auth
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  auth_db:
