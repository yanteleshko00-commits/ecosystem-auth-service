<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Аккаунт экосистемы</title>
  <link rel="stylesheet" href="/assets/auth.css?v=20261119-2">
  <script src="/assets/auth.js?v=20261119-2" defer></script>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="mark" aria-hidden="true">✦</div>
      <p class="eyebrow">ЕДИНЫЙ АККАУНТ</p>
      <h1 id="heading">Войти в аккаунт</h1>
      <p class="muted" id="subheading">Один аккаунт для самостоятельных сервисов экосистемы.</p>
      <div class="tabs" role="tablist" aria-label="Действие">
        <button class="tab active" type="button" data-mode="login">Войти</button>
        <button class="tab" type="button" data-mode="register">Регистрация</button>
      </div>
      <form id="auth-form" novalidate>
        <div id="name-field" class="hidden">
          <label for="name">Имя</label>
          <input id="name" name="name" type="text" autocomplete="given-name" maxlength="60" placeholder="Как к вам обращаться?">
        </div>
        <label for="email">Email</label>
        <div class="email-row">
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
          <button class="verify-email-button" id="verify-email-action" type="button">Подтвердить email</button>
        </div>
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" placeholder="Не менее 10 символов">
        <button class="primary" type="submit" id="submit">Войти</button>
      </form>
      <div class="verify-modal hidden" id="verify-modal" role="dialog" aria-modal="true" aria-labelledby="verify-title">
        <div class="verify-modal-card">
          <button class="modal-close" type="button" id="close-verify" aria-label="Закрыть">×</button>
          <div class="modal-icon">✉</div>
          <h2 id="verify-title">Подтверждение email</h2>
          <p class="modal-description">Мы отправили шестизначный код на вашу почту. Введите его ниже.</p>
          <form id="verify-form" novalidate>
            <label for="verify-email">Email</label>
            <input id="verify-email" type="email" autocomplete="email" required readonly>
            <label for="code">Код из письма</label>
            <input id="code" class="code-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
            <button class="primary" type="submit" id="verify-submit">Подтвердить</button>
            <button class="quiet" type="button" id="resend">Отправить код повторно</button>
          </form>
          <div class="modal-message" id="verify-message" role="status" aria-live="polite"></div>
        </div>
      </div>
      <div class="message" id="message" role="status" aria-live="polite"></div>
      <button class="quiet forgot" id="forgot" type="button">Забыли пароль?</button>
      <p class="footnote">Пароль хранится в виде криптографического хеша. Код подтверждения действует 10 минут.</p>
    </section>
  </main>
</body>
</html>
